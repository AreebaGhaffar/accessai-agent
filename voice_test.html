<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Test</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #f0f2f5;
      --surface:   #ffffff;
      --border:    #e0e0e0;
      --primary:   #1a73e8;
      --primary-lt:#e8f0fe;
      --text:      #222;
      --muted:     #666;
      --danger:    #c62828;
      --success:   #2e7d32;
      --radius:    12px;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* ─── HEADER ─────────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      margin-right: 8px;
    }

    /* ─── TAB BAR ─────────────────────────────────────── */
    #tab-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 1;
      overflow-x: auto;
      scrollbar-width: none;
    }
    #tab-bar::-webkit-scrollbar { display: none; }

    .tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      border: 1.5px solid transparent;
      color: var(--muted);
      background: transparent;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      position: relative;
    }

    .tab:hover {
      background: var(--bg);
      color: var(--text);
    }

    .tab.active {
      background: var(--primary-lt);
      border-color: var(--primary);
      color: var(--primary);
    }

    .tab .close-tab {
      font-size: 0.75rem;
      line-height: 1;
      opacity: 0.5;
      background: none;
      border: none;
      cursor: pointer;
      color: inherit;
      padding: 0 0 0 2px;
      flex-shrink: 0;
    }
    .tab .close-tab:hover { opacity: 1; }

    #add-tab-btn {
      flex-shrink: 0;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: 1.5px dashed var(--border);
      background: transparent;
      cursor: pointer;
      font-size: 1.1rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    #add-tab-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-lt);
    }

    /* ─── MAIN LAYOUT ─────────────────────────────────── */
    main {
      flex: 1;
      display: flex;
      gap: 20px;
      padding: 24px;
      align-items: flex-start;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
    }

    /* ─── SESSION PANEL (center) ─────────────────────── */
    #session-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* mic area */
    #mic-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
    }

    #mic-btn {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: none;
      background: #888;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.6rem;
      transition: background 0.2s, transform 0.1s;
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    }
    #mic-btn:hover { transform: scale(1.05); }
    #mic-btn.listening {
      background: var(--primary);
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0   rgba(26,115,232,.5); }
      70%  { box-shadow: 0 0 0 18px rgba(26,115,232,0);  }
      100% { box-shadow: 0 0 0 0   rgba(26,115,232,0);   }
    }

    #status {
      margin-top: 16px;
      font-size: 0.9rem;
      color: var(--muted);
      height: 1.2em;
      text-align: center;
    }

    /* transcript */
    .panel-label {
      width: 100%;
      max-width: 580px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: #aaa;
      margin-bottom: 6px;
    }

    #transcript-box {
      width: 100%;
      max-width: 580px;
      min-height: 110px;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 18px;
      font-size: 1rem;
      color: var(--text);
      line-height: 1.6;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      word-wrap: break-word;
      margin-bottom: 10px;
    }
    #transcript-box .interim { color: #aaa; }

    #clear-btn {
      align-self: flex-end;
      margin-bottom: 24px;
      margin-right: calc(50% - 290px);
      padding: 6px 16px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      cursor: pointer;
      font-size: 0.82rem;
      color: var(--muted);
      transition: background 0.15s;
    }
    #clear-btn:hover { background: #eee; }

    /* response */
    #response-section {
      width: 100%;
      max-width: 580px;
    }

    #response-box {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      font-size: 0.97rem;
      color: var(--text);
      line-height: 1.6;
      min-height: 72px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
    }
    #response-box.sending { opacity: 0.6; }

    .response-placeholder { color: #bbb; font-style: italic; }

    .response-row { display: flex; align-items: baseline; gap: 10px; }
    .response-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      min-width: 52px;
      color: #888;
    }
    .response-value { font-size: 0.97rem; color: var(--text); word-break: break-word; }

    #response-box.success .response-label   { color: var(--success); }
    #response-box.error-state               { border-left: 4px solid var(--danger); }
    #response-box.error-state .response-label { color: var(--danger); }

    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 3px solid #e0e0e0;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      position: absolute;
      top: 18px;
      right: 18px;
    }
    .spinner.active { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── HISTORY SIDEBAR ─────────────────────────────── */
    #history-sidebar {
      width: 220px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 4px;
    }

    #history-sidebar h2 {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: #aaa;
      margin-bottom: 4px;
    }

    .history-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .history-card:hover {
      border-color: var(--primary);
      box-shadow: 0 2px 8px rgba(26,115,232,.12);
    }
    .history-card.active-card {
      border-color: var(--primary);
      background: var(--primary-lt);
      box-shadow: 0 2px 8px rgba(26,115,232,.15);
    }

    .card-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-meta {
      font-size: 0.75rem;
      color: var(--muted);
    }

    #no-history {
      font-size: 0.82rem;
      color: #bbb;
      font-style: italic;
    }

    /* ─── UNSUPPORTED ────────────────────────────────── */
    #unsupported {
      display: none;
      color: var(--danger);
      font-size: 0.95rem;
      margin-top: 20px;
      text-align: center;
    }

    /* ─── RESPONSIVE ─────────────────────────────────── */
    @media (max-width: 700px) {
      main { flex-direction: column; padding: 16px; }
      #history-sidebar { width: 100%; flex-direction: row; flex-wrap: wrap; }
      .history-card { width: calc(50% - 4px); }
      #clear-btn { margin-right: 0; }
    }
  </style>
</head>
<body>

  <!-- ── Header / Tab bar ── -->
  <header>
    <h1>🎤 Voice Test</h1>
    <div id="tab-bar"></div>
    <button id="add-tab-btn" title="New session">+</button>
  </header>

  <!-- ── Main workspace ── -->
  <main>
    <!-- Center: active session panel -->
    <div id="session-panel">
      <div id="mic-area">
        <button id="mic-btn" title="Click to speak">🎤</button>
        <p id="status">Click the mic to start</p>
      </div>

      <div class="panel-label">Transcript</div>
      <div id="transcript-box">
        <span id="final-text"></span><span id="interim-text" class="interim"></span>
      </div>
      <button id="clear-btn">Clear</button>

      <section id="response-section">
        <div class="panel-label">Backend Response</div>
        <div id="response-box">
          <div class="spinner" id="spinner"></div>
          <p class="response-placeholder" id="response-placeholder">Waiting for a command…</p>
        </div>
      </section>

      <p id="unsupported">⚠️ Your browser does not support the Web Speech API. Try Chrome or Edge.</p>
    </div>

    <!-- Right: session history sidebar -->
    <aside id="history-sidebar">
      <h2>Sessions</h2>
      <p id="no-history">No other sessions yet</p>
    </aside>
  </main>

  <script>
  (() => {
    // ── DOM refs ──────────────────────────────────────────────────────────
    const micBtn        = document.getElementById('mic-btn');
    const statusEl      = document.getElementById('status');
    const finalTextEl   = document.getElementById('final-text');
    const interimTextEl = document.getElementById('interim-text');
    const clearBtn      = document.getElementById('clear-btn');
    const unsupported   = document.getElementById('unsupported');
    const responseBox   = document.getElementById('response-box');
    const spinnerEl     = document.getElementById('spinner');
    const placeholder   = document.getElementById('response-placeholder');
    const tabBar        = document.getElementById('tab-bar');
    const addTabBtn     = document.getElementById('add-tab-btn');
    const historySide   = document.getElementById('history-sidebar');
    const noHistory     = document.getElementById('no-history');

    const BACKEND_URL   = 'http://localhost:8000/command';

    // ── Session store ─────────────────────────────────────────────────────
    // Each session: { id, label, finalText, interimText, responseHTML, responseClass }
    let sessions   = [];
    let activeId   = null;
    let nextId     = 1;

    function createSession(label) {
      const id = nextId++;
      const session = {
        id,
        label: label || `Session ${id}`,
        finalText:     '',
        interimText:   '',
        responseHTML:  '',           // serialised inner HTML of responseBox
        responseClass: '',           // className of responseBox
      };
      sessions.push(session);
      return session;
    }

    // ── Save active session state into the store ──────────────────────────
    function saveActiveSession() {
      const s = sessions.find(s => s.id === activeId);
      if (!s) return;
      s.finalText     = finalTextEl.textContent;
      s.interimText   = interimTextEl.textContent;
      s.responseHTML  = responseBox.innerHTML;
      s.responseClass = responseBox.className;
      // Derive a label from the transcript if we still have the default name
      if (s.finalText.trim()) {
        const words = s.finalText.trim().split(/\s+/).slice(0, 5).join(' ');
        s.label = words.length < s.finalText.trim().length ? words + '…' : words;
      }
    }

    // ── Load a session into the UI ────────────────────────────────────────
    function loadSession(id) {
      // Stop any ongoing recognition first
      if (userWantsListening) {
        userWantsListening = false;
        try { recognition && recognition.stop(); } catch (_) {}
        micBtn.classList.remove('listening');
      }

      saveActiveSession();
      activeId = id;

      const s = sessions.find(s => s.id === id);
      if (!s) return;

      finalTextEl.textContent   = s.finalText;
      interimTextEl.textContent = '';    // never restore live interim
      responseBox.innerHTML     = s.responseHTML || `<div class="spinner" id="spinner"></div>
        <p class="response-placeholder" id="response-placeholder">Waiting for a command…</p>`;
      responseBox.className     = s.responseClass || '';

      // Re-bind spinner / placeholder refs (they got replaced by innerHTML)
      rebindResponseRefs();

      statusEl.textContent = 'Click the mic to start';
      accumulatedFinal     = s.finalText;   // allow continuation

      renderTabs();
      renderHistory();
    }

    function rebindResponseRefs() {
      // After re-setting innerHTML the old node references are stale
      const newSpinner     = responseBox.querySelector('.spinner');
      const newPlaceholder = responseBox.querySelector('.response-placeholder');
      // We shadow the outer vars via closure — use the module-level mutable refs
      _spinner     = newSpinner     || null;
      _placeholder = newPlaceholder || null;
    }

    // Mutable pointers used by sendToBackend so it always targets the live nodes
    let _spinner     = spinnerEl;
    let _placeholder = placeholder;

    // ── Render tabs in the header ─────────────────────────────────────────
    function renderTabs() {
      tabBar.innerHTML = '';
      sessions.forEach(s => {
        const btn = document.createElement('button');
        btn.className  = 'tab' + (s.id === activeId ? ' active' : '');
        btn.title      = s.label;
        btn.dataset.id = s.id;

        const labelSpan = document.createElement('span');
        labelSpan.textContent = s.label;
        labelSpan.style.overflow     = 'hidden';
        labelSpan.style.textOverflow = 'ellipsis';

        const closeBtn = document.createElement('button');
        closeBtn.className   = 'close-tab';
        closeBtn.textContent = '×';
        closeBtn.title       = 'Close session';
        closeBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          closeSession(s.id);
        });

        btn.appendChild(labelSpan);
        btn.appendChild(closeBtn);
        btn.addEventListener('click', () => {
          if (s.id !== activeId) loadSession(s.id);
        });

        tabBar.appendChild(btn);
      });
    }

    // ── Render history sidebar ────────────────────────────────────────────
    function renderHistory() {
      // Remove existing cards (keep the h2 and no-history p)
      historySide.querySelectorAll('.history-card').forEach(el => el.remove());

      const others = sessions.filter(s => s.id !== activeId);
      noHistory.style.display = others.length === 0 ? '' : 'none';

      others.forEach(s => {
        const card = document.createElement('div');
        card.className   = 'history-card';
        card.dataset.id  = s.id;

        const label = document.createElement('div');
        label.className   = 'card-label';
        label.textContent = s.label;

        const meta = document.createElement('div');
        meta.className   = 'card-meta';
        const words = s.finalText.trim().split(/\s+/).length;
        meta.textContent = s.finalText.trim()
          ? `${words} word${words !== 1 ? 's' : ''} · click to resume`
          : 'Empty · click to resume';

        card.appendChild(label);
        card.appendChild(meta);
        card.addEventListener('click', () => loadSession(s.id));
        historySide.appendChild(card);
      });
    }

    // ── Close / remove a session ──────────────────────────────────────────
    function closeSession(id) {
      const idx = sessions.findIndex(s => s.id === id);
      if (idx === -1) return;
      sessions.splice(idx, 1);

      if (sessions.length === 0) {
        // Always keep at least one session
        const fresh = createSession();
        loadSession(fresh.id);
      } else if (id === activeId) {
        // Switch to the nearest remaining session
        const next = sessions[Math.min(idx, sessions.length - 1)];
        loadSession(next.id);
      } else {
        renderTabs();
        renderHistory();
      }
    }

    // ── "+" button ────────────────────────────────────────────────────────
    addTabBtn.addEventListener('click', () => {
      saveActiveSession();
      const s = createSession();
      loadSession(s.id);
    });

    // ── Backend call ──────────────────────────────────────────────────────
    async function sendToBackend(text) {
      responseBox.className = 'sending';
      if (_spinner)     _spinner.classList.add('active');
      if (_placeholder) _placeholder.style.display = 'none';

      responseBox.querySelectorAll('.response-row').forEach(el => el.remove());

      try {
        const res = await fetch(BACKEND_URL, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ text }),
        });

        if (!res.ok) throw new Error(`Server responded with ${res.status} ${res.statusText}`);

        const data = await res.json();
        const fields = [
          { label: 'Action', value: data.action ?? '—' },
          { label: 'Target', value: data.target ?? '—' },
          { label: 'Status', value: data.status ?? '—' },
        ];

        fields.forEach(({ label, value }) => {
          const row = document.createElement('div');
          row.className = 'response-row';
          row.innerHTML = `<span class="response-label">${label}</span>
                           <span class="response-value">${escapeHtml(String(value))}</span>`;
          responseBox.appendChild(row);
        });

        responseBox.className = 'success';

      } catch (err) {
        const row = document.createElement('div');
        row.className = 'response-row';
        const message = (err instanceof TypeError && err.message.toLowerCase().includes('fetch'))
          ? 'Could not reach the backend. Is it running on localhost:8000?'
          : err.message;
        row.innerHTML = `<span class="response-label">Error</span>
                         <span class="response-value">${escapeHtml(message)}</span>`;
        responseBox.appendChild(row);
        responseBox.className = 'error-state';

      } finally {
        if (_spinner) _spinner.classList.remove('active');
        // Update saved state after response lands
        saveActiveSession();
        renderTabs();
        renderHistory();
      }
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ── Speech recognition ────────────────────────────────────────────────
    const SpeechRecognition =
      window.SpeechRecognition || window.webkitSpeechRecognition;

    let recognition        = null;
    let userWantsListening = false;
    let accumulatedFinal   = '';

    if (!SpeechRecognition) {
      unsupported.style.display = 'block';
      micBtn.disabled      = true;
      micBtn.style.opacity = '0.4';
      micBtn.style.cursor  = 'not-allowed';
    } else {
      recognition = new SpeechRecognition();
      recognition.continuous     = true;
      recognition.interimResults = true;
      recognition.lang           = 'en-US';

      function startRecognition() {
        try { recognition.start(); } catch (_) {}
      }

      micBtn.addEventListener('click', () => {
        if (!userWantsListening) {
          userWantsListening = true;
          // Continue from existing transcript (continuation mode)
          micBtn.classList.add('listening');
          statusEl.textContent = 'Listening… click mic to stop';
          startRecognition();
        } else {
          userWantsListening = false;
          recognition.stop();
        }
      });

      recognition.onstart = () => {
        if (userWantsListening) {
          micBtn.classList.add('listening');
          statusEl.textContent = 'Listening… click mic to stop';
        }
      };

      recognition.onend = () => {
        if (userWantsListening) {
          startRecognition();
        } else {
          micBtn.classList.remove('listening');
          interimTextEl.textContent = '';

          const textToSend = accumulatedFinal.trim();
          if (textToSend) {
            statusEl.textContent = 'Sending…';
            sendToBackend(textToSend).then(() => {
              statusEl.textContent = 'Click the mic to start';
            });
          } else {
            statusEl.textContent = 'Click the mic to start';
          }
        }
      };

      recognition.onerror = (e) => {
        if (e.error === 'no-speech' || e.error === 'aborted') return;
        userWantsListening = false;
        micBtn.classList.remove('listening');
        statusEl.textContent = 'Error: ' + e.error;
        interimTextEl.textContent = '';
      };

      recognition.onresult = (e) => {
        let interim = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const t = e.results[i][0].transcript;
          if (e.results[i].isFinal) {
            accumulatedFinal += t + ' ';
          } else {
            interim += t;
          }
        }
        finalTextEl.textContent   = accumulatedFinal;
        interimTextEl.textContent = interim;
        // Keep session store in sync with live typing
        const s = sessions.find(s => s.id === activeId);
        if (s) s.finalText = accumulatedFinal;
      };
    }

    // ── Clear button ──────────────────────────────────────────────────────
    clearBtn.addEventListener('click', () => {
      accumulatedFinal          = '';
      finalTextEl.textContent   = '';
      interimTextEl.textContent = '';
      responseBox.querySelectorAll('.response-row').forEach(el => el.remove());
      responseBox.className = '';
      if (_placeholder) _placeholder.style.display = '';
      // Update the session label back to default
      const s = sessions.find(s => s.id === activeId);
      if (s) {
        s.finalText     = '';
        s.responseHTML  = '';
        s.responseClass = '';
        s.label         = `Session ${s.id}`;
      }
      renderTabs();
      renderHistory();
    });

    // ── Bootstrap first session ───────────────────────────────────────────
    const initial = createSession('Session 1');
    activeId = initial.id;
    renderTabs();
    renderHistory();

  })();
  </script>

</body>
</html>
