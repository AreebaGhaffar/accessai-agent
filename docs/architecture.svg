<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9aa0c0"/>
    </marker>
  </defs>
  <rect width="900" height="520" fill="#0d0f1a"/>
  <text x="450" y="36" text-anchor="middle" fill="#e8eaf0" font-size="20" font-weight="700">AccessAI Agent: how a spoken command becomes an action</text>

  <rect x="20" y="60" width="520" height="320" rx="14" fill="none" stroke="#4fc3f7" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="36" y="84" fill="#4fc3f7" font-size="14" font-weight="600">Your laptop</text>
  <rect x="580" y="60" width="300" height="320" rx="14" fill="none" stroke="#ffb74d" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="596" y="84" fill="#ffb74d" font-size="14" font-weight="600">AWS (us-east-1)</text>

  <g fill="#1a1f38" stroke="#3b4170" stroke-width="1.2">
    <rect x="40" y="110" width="200" height="70" rx="10"/>
    <rect x="290" y="110" width="220" height="70" rx="10"/>
    <rect x="290" y="260" width="220" height="80" rx="10"/>
    <rect x="600" y="110" width="260" height="70" rx="10"/>
    <rect x="600" y="260" width="260" height="80" rx="10"/>
  </g>
  <g fill="#e8eaf0" font-size="15" font-weight="600" text-anchor="middle">
    <text x="140" y="140">Voice page</text>
    <text x="400" y="140">Local executor</text>
    <text x="400" y="294">Actions on screen</text>
    <text x="730" y="140">Cloud brain</text>
    <text x="730" y="294">Amazon Bedrock</text>
  </g>
  <g fill="#9aa0c0" font-size="12" text-anchor="middle">
    <text x="140" y="162">Mic, editable text, Send</text>
    <text x="400" y="162">FastAPI on port 8001</text>
    <text x="400" y="316">Browser, keyboard, mouse</text>
    <text x="400" y="332">Gmail, WhatsApp, scrolling</text>
    <text x="730" y="162">FastAPI on Elastic Beanstalk</text>
    <text x="730" y="316">Claude Haiku 4.5</text>
    <text x="730" y="332">Plans the steps</text>
  </g>

  <g stroke="#9aa0c0" stroke-width="1.8" fill="none">
    <line x1="240" y1="145" x2="288" y2="145" marker-end="url(#a)"/>
    <line x1="510" y1="135" x2="598" y2="135" marker-end="url(#a)"/>
    <line x1="598" y1="160" x2="510" y2="160" marker-end="url(#a)"/>
    <line x1="400" y1="180" x2="400" y2="258" marker-end="url(#a)"/>
    <line x1="710" y1="180" x2="710" y2="258" marker-end="url(#a)"/>
    <line x1="750" y1="258" x2="750" y2="182" marker-end="url(#a)"/>
  </g>

  <g fill="#4fc3f7" font-size="12" font-weight="700" text-anchor="middle">
    <circle cx="264" cy="128" r="10"/><circle cx="554" cy="120" r="10"/><circle cx="554" cy="176" r="10"/><circle cx="415" cy="220" r="10"/><circle cx="690" cy="220" r="10"/><circle cx="770" cy="220" r="10"/>
  </g>
  <g fill="#0d0f1a" font-size="12" font-weight="700" text-anchor="middle">
    <text x="264" y="132">1</text><text x="554" y="124">2</text><text x="554" y="180">4</text><text x="415" y="224">5</text><text x="690" y="224">3</text><text x="770" y="224">3</text>
  </g>

  <g fill="#c9cde0" font-size="13">
    <text x="40" y="414">1  You speak. The page turns it into text you can fix before sending.</text>
    <text x="40" y="438">2  The local executor sends the text and a secret key to the cloud brain.</text>
    <text x="40" y="462">3  The cloud brain asks Claude on Amazon Bedrock to plan the steps.</text>
    <text x="40" y="486">4  The plan returns as a short list of JSON steps.</text>
    <text x="40" y="510">5  The executor performs each step on your laptop and reports what worked.</text>
  </g>
</svg>
